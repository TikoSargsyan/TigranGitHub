name: Postman Collection Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  run-postman-collection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install --global newman

      - name: Run Postman Collection
        run: newman run "SQL and Postman.postman_collection.json"
